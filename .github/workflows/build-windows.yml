# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Windows build workflow.
#
# Builds fb_server + fb-cli against vcpkg on windows-latest using
# MSVC + the win-msvc-release CMake preset. The desktop client (Qt6
# + GStreamer) and mesh bridge (POSIX termios) are intentionally OFF
# for the Windows target — see docs/windows-port-status.md.
#
# Smoke-tests fb_server.exe --help + fb-cli.exe --help after build
# so a successful binary that immediately crashes on startup gets
# caught here rather than at runtime. Publishes
# finbit-windows-x64.zip to the rolling `nightly` GitHub Release on
# every push to main; on a v* tag, attaches the same zip to the
# tagged release release.yml creates.

name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed by softprops/action-gh-release on tagged + nightly publish

jobs:
  build:
    name: build fb_server + fb-cli (windows-latest, MSVC, vcpkg)
    runs-on: windows-latest
    # Strict mode: a failed Windows build blocks the merge. The
    # initial port is done (see docs/windows-port-status.md) and
    # both compile + smoke have shipped green at least once.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: locate vcpkg
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "vcpkg at: $env:VCPKG_INSTALLATION_ROOT"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version

      - name: cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: configure (win-msvc-release preset)
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          cmake --preset win-msvc-release `
            -DFB_BUILD_DESKTOP_CLIENT=OFF `
            -DFB_BUILD_TESTS=OFF

      - name: build
        shell: pwsh
        run: cmake --build --preset win-msvc-release --parallel

      - name: smoke — fb_server.exe --help
        if: success()
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build/win-msvc-release `
                                -Filter fb_server.exe | Select-Object -First 1
          if (-not $exe) { throw "fb_server.exe not found" }
          & $exe.FullName --help
          if ($LASTEXITCODE -ne 0) {
            throw "fb_server.exe --help exit code $LASTEXITCODE"
          }

      - name: smoke — fb-cli.exe --help
        if: success()
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build/win-msvc-release `
                                -Filter fb-cli.exe | Select-Object -First 1
          if (-not $exe) { throw "fb-cli.exe not found" }
          # fb-cli prints usage to stderr and exits non-zero on no-args;
          # asking for --help should work cleanly.
          & $exe.FullName --help
          # fb-cli's --help returns 0; if it returns non-zero something
          # is genuinely wrong with the binary.
          if ($LASTEXITCODE -ne 0) {
            throw "fb-cli.exe --help exit code $LASTEXITCODE"
          }

      - name: collect binaries + bundle as zip
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Get-ChildItem -Recurse -Path build/win-msvc-release `
            -Include fb_server.exe, fb-cli.exe `
            | ForEach-Object { Copy-Item $_.FullName artifacts/ }
          # vcpkg DLLs the binaries link against (libsodium.dll,
          # protobuf.dll, etc.) live next to the .exe inside the
          # Release subdir.  Include them so the artifact is
          # runnable on a clean Windows box.
          Get-ChildItem -Recurse -Path build/win-msvc-release `
            -Include *.dll `
            | ForEach-Object { Copy-Item $_.FullName artifacts/ -ErrorAction SilentlyContinue }
          Copy-Item LICENSE, README.md, CHANGELOG.md, ROADMAP.md `
            artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts/
          # Single .zip the release attaches and users can download.
          Compress-Archive -Path artifacts/* `
                            -DestinationPath finbit-windows-x64.zip -Force
          # Sidecar SHA-256 so downloaders can verify.
          (Get-FileHash -Algorithm SHA256 finbit-windows-x64.zip).Hash.ToLower() `
            + "  finbit-windows-x64.zip" `
            | Out-File -Encoding ASCII finbit-windows-x64.zip.sha256
          Get-ChildItem finbit-windows-x64.zip*

      - name: upload CI artifact (per-commit, 14-day retention)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: finbit-windows-x64-${{ github.sha }}
          path: |
            finbit-windows-x64.zip
            finbit-windows-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------------------
      # Rolling "nightly" release. Mirrors the Linux nightly publish in
      # ci.yml — softprops/action-gh-release merges assets into the
      # existing release without deleting the Linux tarball, so a
      # `nightly` release ends up holding BOTH the Linux .tar.gz and
      # the Windows .zip side-by-side.
      - name: publish to nightly release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "FinBit nightly (head of main)"
          prerelease: true
          files: |
            finbit-windows-x64.zip
            finbit-windows-x64.zip.sha256
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}

      # -----------------------------------------------------------------
      # Tagged-release publish. release.yml builds the Linux tarball
      # and creates the v* Release; this step appends the matching
      # Windows .zip alongside.
      - name: publish to v* tagged release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            finbit-windows-x64.zip
            finbit-windows-x64.zip.sha256
          fail_on_unmatched_files: true

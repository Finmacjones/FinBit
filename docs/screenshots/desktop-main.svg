<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00ff9d" opacity="0.04"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <style>
      text{fill:#9fd9b8}
      .brand{fill:#00ff9d}.hdr{fill:#c8ffe1}.muted{fill:#4f8568}.dimtxt{fill:#2f5a44}
      .lbl{fill:#4f8568;font-size:10px;letter-spacing:1px}
      .row{fill:#4f8568;font-size:12px}.b{font-weight:600}
    </style>
  </defs>

  <!-- surfaces -->
  <rect width="1120" height="700" fill="#000"/>
  <rect x="76"  width="256" height="700" fill="#080c0a"/>
  <rect x="332" width="488" height="700" fill="#0a0f0c"/>
  <rect x="820" width="300" height="700" fill="#080c0a"/>
  <rect width="76" height="700" fill="#050807"/>
  <line x1="76"  y1="0" x2="76"  y2="700" stroke="#163322"/>
  <line x1="332" y1="0" x2="332" y2="700" stroke="#163322"/>
  <line x1="820" y1="0" x2="820" y2="700" stroke="#163322"/>

  <!-- ░░ server rail ░░ -->
  <g>
    <rect x="14" y="20" width="48" height="48" rx="2" fill="#112019" stroke="#00ff9d"/>
    <text x="38" y="50" text-anchor="middle" class="brand b" font-size="13">FB</text>
    <text x="6" y="49" class="brand" font-size="14">&gt;</text>
    <line x1="22" y1="84" x2="54" y2="84" stroke="#163322"/>
    <rect x="14" y="96"  width="48" height="48" rx="2" fill="none" stroke="#163322"/>
    <text x="38" y="126" text-anchor="middle" class="muted" font-size="13">ML</text>
    <rect x="14" y="156" width="48" height="48" rx="2" fill="none" stroke="#163322"/>
    <text x="38" y="186" text-anchor="middle" class="muted" font-size="13">RC</text>
    <rect x="14" y="216" width="48" height="48" rx="2" fill="none" stroke="#163322" stroke-dasharray="3 3"/>
    <text x="38" y="247" text-anchor="middle" class="muted" font-size="18">+</text>
  </g>

  <!-- ░░ channels panel ░░ -->
  <g>
    <text x="92" y="44" class="brand b" font-size="13" letter-spacing="1px">FINBIT HQ</text>
    <rect x="276" y="32" width="36" height="16" fill="none" stroke="#00ff9d"/>
    <text x="294" y="44" text-anchor="middle" class="brand" font-size="9">E2E</text>
    <line x1="76" y1="60" x2="332" y2="60" stroke="#163322"/>

    <text x="92"  y="86" class="lbl">── DIRECT MESSAGES</text>
    <rect x="20" y="34" width="0" height="0"/>
    <rect x="88" y="98" width="28" height="28" rx="2" fill="#f8d72b" stroke="#f8d72b"/>
    <text x="102" y="117" text-anchor="middle" font-size="12" fill="#1f1900" class="b">A</text>
    <text x="126" y="116" class="row">alice</text>
    <text x="300" y="116" text-anchor="end" class="dimtxt" font-size="10">fp:3f2a</text>
    <rect x="88" y="132" width="28" height="28" rx="2" fill="#ff3b6b" stroke="#ff3b6b"/>
    <text x="102" y="151" text-anchor="middle" font-size="12" fill="#2a0011" class="b">C</text>
    <text x="126" y="150" class="row">carol</text>
    <text x="300" y="150" text-anchor="end" class="dimtxt" font-size="10">fp:81de</text>

    <text x="92" y="190" class="lbl">── CHANNELS</text>
    <rect x="84" y="200" width="240" height="26" rx="2" fill="#112019"/>
    <rect x="84" y="200" width="2" height="26" fill="#00ff9d"/>
    <text x="98" y="218" class="brand">#</text>
    <text x="116" y="218" class="brand">general</text>
    <text x="98"  y="248" class="muted">#</text>
    <text x="116" y="248" class="row">dev</text>
    <rect x="296" y="238" width="20" height="15" fill="#00ff9d"/>
    <text x="306" y="249" text-anchor="middle" font-size="10" fill="#001b10" class="b">3</text>
    <text x="98"  y="278" class="muted">~</text>
    <text x="116" y="278" class="row">voice</text>

    <text x="92" y="316" class="lbl">── FORWARDERS</text>
    <text x="98"  y="344" class="muted">»</text>
    <text x="116" y="344" class="row">relay-eu-1</text>
    <text x="300" y="344" text-anchor="end" class="dimtxt" font-size="10">12ms</text>
    <text x="98"  y="370" class="muted">»</text>
    <text x="116" y="370" class="row">relay-us-2</text>
    <text x="300" y="370" text-anchor="end" class="dimtxt" font-size="10">98ms</text>

    <!-- user panel -->
    <rect x="76" y="652" width="256" height="48" fill="#070a08"/>
    <line x1="76" y1="652" x2="332" y2="652" stroke="#163322"/>
    <rect x="88" y="662" width="28" height="28" rx="2" fill="#00ff9d" stroke="#00ff9d"/>
    <text x="102" y="681" text-anchor="middle" font-size="12" fill="#001b10" class="b">B</text>
    <circle cx="114" cy="688" r="4" fill="#00ff9d"/>
    <text x="126" y="676" class="brand" font-size="12">bob</text>
    <rect x="150" y="666" width="26" height="13" fill="#00ff9d"/>
    <text x="163" y="676" text-anchor="middle" font-size="8" fill="#001b10" class="b">YOU</text>
    <text x="126" y="690" class="dimtxt" font-size="10">3f2a·9c1d·e7b4·60aa</text>
  </g>

  <!-- ░░ chat ░░ -->
  <g>
    <text x="350" y="33" class="brand b" font-size="14">#general</text>
    <line x1="452" y1="18" x2="452" y2="38" stroke="#163322"/>
    <rect x="466" y="24" width="6" height="6" fill="#00ff9d"/>
    <text x="480" y="33" class="muted" font-size="11">end-to-end encrypted · 4 members</text>
    <line x1="332" y1="48" x2="820" y2="48" stroke="#163322"/>

    <!-- message 1 -->
    <rect x="356" y="86" width="32" height="32" rx="2" fill="#f8d72b" stroke="#f8d72b"/>
    <text x="372" y="107" text-anchor="middle" font-size="13" fill="#1f1900" class="b">A</text>
    <text x="400" y="100"><tspan class="dimtxt">&lt;</tspan><tspan class="brand b">alice</tspan><tspan class="dimtxt">&gt;</tspan><tspan class="dimtxt" dx="6" font-size="10">14:02</tspan></text>
    <text x="400" y="116" font-size="12">pushed the forwarder graph — calls scale past mesh now</text>

    <!-- message 2 (bob) -->
    <rect x="356" y="140" width="32" height="32" rx="2" fill="#00ff9d" stroke="#00ff9d"/>
    <text x="372" y="161" text-anchor="middle" font-size="13" fill="#001b10" class="b">B</text>
    <text x="400" y="154"><tspan class="dimtxt">&lt;</tspan><tspan class="brand b">bob</tspan><tspan class="dimtxt">&gt;</tspan><tspan class="dimtxt" dx="6" font-size="10">14:03</tspan></text>
    <text x="400" y="170" font-size="12">nice. still blind at the relay? SFrame seals every frame?</text>

    <!-- message 3 (alice + attachment) -->
    <rect x="356" y="196" width="32" height="32" rx="2" fill="#f8d72b" stroke="#f8d72b"/>
    <text x="372" y="217" text-anchor="middle" font-size="13" fill="#1f1900" class="b">A</text>
    <text x="400" y="210"><tspan class="dimtxt">&lt;</tspan><tspan class="brand b">alice</tspan><tspan class="dimtxt">&gt;</tspan><tspan class="dimtxt" dx="6" font-size="10">14:05</tspan></text>
    <text x="400" y="226" font-size="12">yep — per-sender keys, forwarder never holds one:</text>
    <rect x="400" y="238" width="300" height="120" fill="#000" stroke="#163322"/>
    <text x="412" y="262" class="dimtxt" font-size="10">topology.png</text>
    <rect x="412" y="334" width="150" height="16" fill="#000" stroke="#163322"/>
    <text x="420" y="346" font-size="10"><tspan class="brand">[ok]</tspan><tspan dx="6">142 KB · sealed</tspan></text>

    <!-- composer -->
    <rect x="348" y="648" width="456" height="40" fill="#0e1612" stroke="#163322"/>
    <text x="362" y="673" class="brand b">$</text>
    <text x="380" y="673" class="dimtxt" font-size="12">message #general</text>
    <text x="792" y="673" text-anchor="end" class="brand" font-size="10">E2E ▮</text>
  </g>

  <!-- ░░ members ░░ -->
  <g>
    <text x="838" y="44" class="lbl">── ONLINE — 2</text>
    <rect x="836" y="58" width="24" height="24" rx="2" fill="#f8d72b" stroke="#f8d72b"/>
    <text x="848" y="75" text-anchor="middle" font-size="11" fill="#1f1900" class="b">A</text>
    <text x="870" y="75" class="brand" font-size="12">alice</text>
    <rect x="836" y="90" width="24" height="24" rx="2" fill="#00ff9d" stroke="#00ff9d"/>
    <text x="848" y="107" text-anchor="middle" font-size="11" fill="#001b10" class="b">B</text>
    <text x="870" y="107" class="brand" font-size="12">bob</text>
    <text x="838" y="146" class="lbl">── OFFLINE — 2</text>
    <rect x="836" y="160" width="24" height="24" rx="2" fill="none" stroke="#1f5036"/>
    <text x="848" y="177" text-anchor="middle" font-size="11" class="muted b">C</text>
    <text x="870" y="177" class="row">carol</text>
    <rect x="836" y="192" width="24" height="24" rx="2" fill="none" stroke="#1f5036"/>
    <text x="848" y="209" text-anchor="middle" font-size="11" class="muted b">D</text>
    <text x="870" y="209" class="row">dave</text>
  </g>

  <!-- CRT scanlines + vignette -->
  <rect width="1120" height="700" fill="url(#scan)"/>
  <rect width="1120" height="700" fill="url(#vig)"/>
  <rect x="0.5" y="0.5" width="1119" height="699" fill="none" stroke="#00ff9d" stroke-opacity="0.5"/>
</svg>

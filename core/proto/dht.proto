syntax = "proto3";

package fb.proto;

option optimize_for = LITE_RUNTIME;

// =============================================================================
// DHT provider records.
//
// A "provider record" is a signed binding from a peer's identity (Ed25519
// pubkey) to a set of currently-reachable transport addresses. Peers publish
// their own records into the DHT and look up other peers' records by pubkey.
// Records carry a TTL — long-lived peers re-publish periodically; offline
// peers' records are pruned when TTL expires.
//
// Same shape as libp2p's PeerRecord / SignedEnvelope but tailored to FinBit's
// existing primitives (Ed25519 + canonical-byte signing, matching the
// username log).
//
// Wire-form privacy: records are PUBLIC and gossiped widely, so they
// intentionally leak (publisher_pubkey → reachable address) bindings. That's
// the point of a peer-discovery layer. To hide presence, a peer simply
// doesn't publish a record (and the DHT can't help others find them — they
// stay reachable only via direct invite).
// =============================================================================

message ProviderRecord {
    // 32-byte Ed25519 public key of the peer this record provides for.
    // Identity = pubkey; the DHT key for storing/lookup is
    // SHA-256(pubkey)[0..20] (matches kademlia.hpp::node_id_from_pubkey).
    bytes  publisher_pubkey = 1;

    // Transport addresses where this peer currently accepts connections.
    // Format: "scheme://host:port" — e.g.
    //   "wss://203.0.113.5:443"
    //   "ws://[2001:db8::1]:8080"
    //   "tcp://198.51.100.7:9000"
    // Multi-homed peers list every reachable address.
    repeated string addresses = 2;

    // Unix-epoch milliseconds at the time of signing.
    uint64 published_at_ms = 3;

    // Record is invalid after published_at_ms + ttl_ms. Recommended
    // ttl: 1 hour for online peers (force re-publish to confirm
    // reachability).
    uint64 ttl_ms = 4;

    // 16 bytes of randomness — same purpose as in UserClaim: prevents
    // identical canonical bytes when (publisher, addresses, time) are
    // equal across two re-publishes.
    bytes  nonce = 5;

    // Ed25519 signature over canonical_signing_bytes(...) — see
    // provider_records.hpp.
    bytes  signature = 6;
}

// Prekey bundle published into the DHT so peers can start a Double
// Ratchet (X3DH) without ever talking to a central server. Same shape
// as ProviderRecord — signed at the application layer, TTL-bounded,
// keyed by publisher_pubkey. Each peer publishes their own bundle and
// re-publishes before TTL expiry; a peer wanting to DM looks up the
// publisher's pubkey in the DHT and runs X3DH against the returned
// signed_prekey.
//
// Wire-form privacy: same as ProviderRecord — these records are
// PUBLIC by design (anyone can look up alice's bundle and start a
// conversation; the security boundary is the X3DH + Double Ratchet on
// top, not the bundle's confidentiality).
message PrekeyRecord {
    bytes  publisher_pubkey       = 1;   // 32B Ed25519 identity
    bytes  signed_prekey          = 2;   // 32B X25519 (signed prekey pub)
    bytes  signed_prekey_signature = 3;  // 64B Ed25519 over signed_prekey,
                                          // signed by the identity key.
                                          // Independent of the outer record
                                          // signature — it survives TTL
                                          // refresh and lets peers verify
                                          // the SPK binding to the identity
                                          // even if they only see the SPK
                                          // bytes out of band.
    uint64 published_at_ms        = 4;
    uint64 ttl_ms                 = 5;
    bytes  nonce                  = 6;   // 16B
    bytes  signature              = 7;   // 64B Ed25519 over canonical
                                          // signing bytes (analogous to
                                          // ProviderRecord.signature).
}

// "I serve prekey for pubkey X — store this record." Sent to the K
// peers closest to SHA-256(record.publisher_pubkey)[0..20].
message DhtPrekeyPublish {
    PrekeyRecord record = 1;
}

// "Fetch prekey for pubkey X." Sent to the K closest peers to
// SHA-256(target_pubkey)[0..20]. Receiver replies with PrekeyResponse.
message DhtPrekeyLookup {
    bytes target_pubkey = 1;
    bytes request_id    = 2;
}

message DhtPrekeyResponse {
    repeated PrekeyRecord records    = 1;
    bytes                 request_id = 2;
}

// Wire envelope for DHT lookup responses: a peer asked "who provides for
// pubkey X?" and the responder returns every fresh record they have for X.
message ProviderLookupResponse {
    repeated ProviderRecord records = 1;

    // 16-byte echo of the request_id from the matching DhtLookup, so
    // lookup callers can correlate replies that may arrive out of
    // order (multiple Kademlia probes in flight at once).
    bytes  request_id = 2;
}

// "I serve pubkey X — store this record." Sent to the K peers closest
// (in XOR distance over the SHA-256(pubkey)[0..20] keyspace) to the
// publisher's NodeId.
message DhtPublish {
    ProviderRecord record = 1;
}

// "Who serves pubkey X?" Sent to the K peers closest to
// SHA-256(target_pubkey)[0..20]. Each receiver replies with a
// ProviderLookupResponse holding whatever records they hold for X.
message DhtLookup {
    bytes  target_pubkey = 1;   // 32-byte Ed25519 pubkey
    bytes  request_id    = 2;   // 16 bytes, echoed in the response
}

// Top-level envelope for inter-node DHT traffic. The owning transport
// (raw TCP, TLS, libp2p stream, …) carries the serialized DhtMessage
// bytes; this oneof is what the receiving DhtNode dispatches on.
message DhtMessage {
    oneof body {
        DhtPublish              publish          = 1;
        DhtLookup               lookup           = 2;
        ProviderLookupResponse  response         = 3;
        DhtPrekeyPublish        prekey_publish   = 4;
        DhtPrekeyLookup         prekey_lookup    = 5;
        DhtPrekeyResponse       prekey_response  = 6;
    }
}

syntax = "proto3";

package fb.proto;

option optimize_for = LITE_RUNTIME;

// =============================================================================
// Noise Protocol Framework messages — Noise_IK pattern.
//
// Noise_IK requires the initiator to know the responder's static public key
// up-front. We retrieve it from the server's key directory (signed by the
// responder's identity key) before sending the first message.
//
// Pattern:
//     <- s            (responder's static key, fetched out-of-band)
//     ...
//     -> e, es, s, ss (NoiseHandshakeInit)
//     <- e, ee, se    (NoiseHandshakeResponse)
//
// After the handshake, both sides have a CipherState pair and switch to the
// ratchet protocol for ongoing messages.
// =============================================================================

message NoiseHandshakeInit {
    bytes ephemeral_pubkey = 1;  // 32 bytes (X25519)
    bytes encrypted_static = 2;  // initiator's static key, encrypted under es
    bytes encrypted_payload = 3; // optional: prekey id, ratchet root key seed
}

message NoiseHandshakeResponse {
    bytes ephemeral_pubkey  = 1;  // 32 bytes (X25519)
    bytes encrypted_payload = 2;  // ratchet root key seed, ack
}

// Pre-key bundle published by each user to the server's key directory.
// Initiators fetch a bundle before starting a Noise_IK session so they can
// begin a conversation with offline recipients.
message PreKeyBundle {
    bytes  identity_pubkey      = 1;  // Ed25519 long-term key
    bytes  signed_prekey        = 2;  // X25519 medium-term key
    bytes  signed_prekey_sig    = 3;  // Ed25519 signature over signed_prekey
    bytes  one_time_prekey      = 4;  // X25519 one-shot, consumed on use
    uint32 one_time_prekey_id   = 5;
    uint64 published_at_ms      = 6;

    // Post-quantum hybrid (Tier 7). When non-empty, the publisher supports
    // ML-KEM-768 + X25519 hybrid key exchange (PQXDH-style). 1184 bytes per
    // FIPS-203. Senders that see this MUST encapsulate against it and ship
    // the resulting ciphertext as Envelope.pq_ct so the recipient can
    // combine it with the X25519 share into a hybrid root.
    bytes  pq_pubkey            = 7;

    // Ed25519 signature over `pq_pubkey` by the identity key — binds the
    // PQ pubkey to the long-term identity. Senders MUST verify before use
    // or a relay/MITM could swap a different PQ key into the bundle (the
    // classical X25519 share is already identity-bound; binding the PQ
    // share too is what makes the hybrid genuinely two-factor).
    bytes  pq_pubkey_sig        = 8;

    // ---- PQ-sig hybrid (Tier 11) ----
    // ML-DSA-65 (FIPS-204) public key (1952 B). When non-empty, the
    // publisher signs the SPK + the KEM pubkey with BOTH Ed25519 AND
    // ML-DSA-65 — verifiers require both to pass (fb::handshake::
    // hybrid_verify). An attacker with a future CRQC who breaks Ed25519
    // still has to forge ML-DSA-65 (a PQ-hard lattice problem) to swap
    // the SPK or KEM pubkey mid-flight. Backward compat: empty fields
    // → Ed25519-only verification (pre-PQ-sig publisher, same trust
    // model as the pre-PQ-sig codebase).
    bytes  pq_sig_pubkey        = 9;

    // Ed25519 signature over pq_sig_pubkey by the identity key. Roots the
    // PQ-sig identity in the existing Ed25519 identity. HONEST LIMIT:
    // this binding sig is Ed25519-only — a CRQC adversary can forge it
    // and swap in their own pq_sig_pubkey, then sign anything with their
    // own PQ-sig key. Full PQ-rooted identity (Ed25519+ML-DSA at the
    // protocol root) is the documented next-tier upgrade.
    bytes  pq_sig_pubkey_sig    = 10;

    // ML-DSA-65 (3309 B) signature over the X25519 signed_prekey by the
    // pq_sig_pubkey. Verified ALONGSIDE signed_prekey_sig — both must
    // pass for a hybrid-verified bundle. A relay/MITM that swaps the
    // SPK must forge BOTH a 64-byte Ed25519 sig AND a 3309-byte ML-DSA
    // sig to go undetected — even a CRQC who can forge the former can't
    // forge the latter without solving an ML-DSA-equivalent lattice
    // problem.
    bytes  signed_prekey_sig_pq = 11;

    // ML-DSA-65 signature over pq_pubkey by pq_sig_pubkey. Same role as
    // signed_prekey_signature_pq but for the KEM pubkey — a swap of
    // pq_pubkey mid-flight requires forging both this and pq_pubkey_sig.
    bytes  pq_pubkey_sig_pq     = 12;
}

// User registration / identity claim posted to the server. Server verifies
// `signature` over `(identity_pubkey || username || timestamp)` and rejects if
// the username is taken.
message IdentityClaim {
    bytes  identity_pubkey  = 1;  // Ed25519
    string username         = 2;
    uint64 timestamp_ms     = 3;
    bytes  signature        = 4;  // Ed25519
}

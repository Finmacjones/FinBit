syntax = "proto3";

package fb.proto;

import "sender_keys.proto";

option optimize_for = LITE_RUNTIME;

// =============================================================================
// DM inner-message wrapper.
//
// Every DM body that travels through the Double Ratchet is a serialized
// `DmPayload`. Today there are two kinds:
//
//   text         — a regular chat message
//   channel_key  — an invite to a SenderKeys group; carries the channel id,
//                  display name, and the sender's distribution. Receiver
//                  installs the distribution against the sender's identity
//                  pubkey (which the receiver already knows because the DM
//                  itself is from them) and subscribes to the channel.
//
// Adding more inner types later is purely additive — bump the oneof.
// =============================================================================
message ChannelKeyDistribution {
    bytes  channel_id   = 1;   // 32 bytes; matches Envelope.channel_group_id
    string channel_name = 2;   // user-friendly name; receiver uses for UI label
    SenderKeysDistribution distribution = 3;
}

// Media call signaling (1:1 voice / video). Carries SDP offers/answers, ICE
// candidates, an SFrame base key for end-to-end frame encryption (so an SFU
// or TURN relay sees only ciphertext), and call-state transitions.
//
// `call_id` is a 16-byte random nonce that disambiguates concurrent calls
// between the same pair (and also feeds the SFrame key derivation, so a
// fresh call gets a fresh frame key even with the same ratchet session).
//
// `kind` identifies what `payload` carries:
//   1 = OFFER     — payload is an SDP offer (UTF-8)
//   2 = ANSWER    — payload is an SDP answer (UTF-8)
//   3 = ICE       — payload is a single ICE candidate (UTF-8 JSON: {candidate, sdpMid, sdpMLineIndex})
//   4 = HANGUP    — payload is empty; receiver tears down the call
//   5 = SFRAME_KEY — payload is the 32-byte SFrame base key (encrypted within the
//                    ratchet so only the peer sees it)
message MediaSignal {
    bytes  call_id = 1;
    uint32 kind    = 2;
    bytes  payload = 3;
    uint32 epoch   = 4;   // for SFRAME_KEY rotations; ignored otherwise

    // Forwarded-room (Lever B §4/§6A) only: when an elected forwarder sends a
    // leaf an OFFER, this maps each outbound SDP media section (`mid`) to the
    // member whose stream it carries, so the leaf opens that track with the
    // right per-sender SFrame key (fb::media::sender_for_track →
    // RoomKeyRegistry). It rides inside the ratchet-sealed MediaSignal, so the
    // relay never sees it (the plaintext top-level RoomOffer.track_bindings is
    // not used on the wire — it would leak room topology to the server).
    message TrackBinding { string mid = 1; bytes sender_pubkey = 2; }
    repeated TrackBinding track_bindings = 5;

    // Tier-7 PQ-hybrid for SFrame (Item 1). Set ONLY on the OFFER kind —
    // the caller encaps against the callee's pq_pubkey (cached from the
    // peer's PreKeyBundle), ships the 1088B ML-KEM-768 ciphertext here.
    // The callee decaps with their pq_sec and HKDF-combines with the
    // X25519 ECDH between the two static identities → identical hybrid
    // SFrame base key on both sides. Empty on non-OFFER kinds; empty on
    // OFFER when the peer hasn't advertised PQ (falls back to pure X25519
    // SFrame base, same behavior as the pre-PQ codebase).
    bytes pq_ct = 6;
}

// MLS (RFC 9420) handshake bytes wrapped for delivery via the Double
// Ratchet DM. Four variants make up the in-band invite flow:
//
//   MlsInviteRequest — inviter → joiner. Kicks off the three-step
//     handshake: "I want to add you to #channel via MLS, please
//     publish a KeyPackage targeted at this channel_id". Joiner's
//     client (when it ships an auto-responder) replies with an
//     MlsKeyPackage; if no responder is wired, the joiner sees a
//     UI prompt and clicks "send my KP".
//
//   MlsKeyPackage — joiner → inviter. The joiner has called
//     MlsGroup::start_join() and exports a KeyPackage; they DM it to
//     the user who's running the channel so that user can call
//     add_member. The KP is the joiner's HPKE init key + signed
//     leaf; mlspp parses it via tls::get<KeyPackage>.
//
//   MlsWelcome — inviter → joiner. After add_member, the inviter
//     unwraps {welcome, commit} and sends the welcome bytes here.
//     The joiner feeds them to PendingMlsJoin::complete to hydrate
//     the group.
//
//   MlsCommit — inviter → existing members (other than themselves).
//     Channel envelopes already broadcast to subscribers; this
//     variant rides the DM ratchet so each existing member can apply
//     the commit and roll their own State to the new epoch. (Once
//     channel envelopes carry an MLS-application discriminator we
//     can move commits onto the channel envelope path too — for now
//     DM keeps the receiver side simple.)
//
// All four carry a `channel_id` so the receiver knows which MLS
// group to apply the bytes to without needing to peek at the MLS
// payload itself.
message MlsInviteRequest {
    bytes  channel_id   = 1;
    string channel_name = 2;   // for the joiner's UI prompt
}
message MlsKeyPackage {
    bytes channel_id  = 1;   // 32-byte channel/group id the joiner targets
    bytes key_package = 2;   // tls::marshal output from PendingMlsJoin
}
message MlsProposal {
    bytes channel_id = 1;
    bytes proposal   = 2;   // wire-form Proposal (Add/Remove/Update); receiver
                            // calls MlsGroup::handle_proposal to stage it
                            // before the matching Commit lands.
}
message MlsWelcome {
    bytes  channel_id   = 1;
    string channel_name = 2;   // for UI sidebar; same role as ChannelKeyDistribution.channel_name
    bytes  welcome      = 3;   // tls::marshal of the mls::Welcome
}
message MlsCommit {
    bytes channel_id = 1;
    bytes commit     = 2;
}

// Inline attachment — a small image / GIF / file carried directly inside
// the DM body (not a detached blob). `content` is the raw file bytes; the
// whole DmPayload is sealed by the Double Ratchet, so the relay sees only
// ciphertext. Kept small on purpose: a single relayed envelope must fit
// under the per-sender burst budget (fb::config::ratelimit::kDefaultBurstBytes,
// 500 KB), so senders cap content at fb::config::kMaxInlineAttachmentBytes
// (256 KiB). Larger media needs the chunked/blob path (not yet built).
message Attachment {
    string mime_type = 1;   // e.g. "image/png", "image/gif", "image/jpeg"
    string filename  = 2;   // original name, for "save as" / display
    bytes  content   = 3;   // raw file bytes (pre-encryption)
}

// Room SFrame key distribution (Lever B group-call keying for SenderKeys
// channels; MLS channels source the room_secret from the MLS exporter
// instead). The room creator/forwarder picks a random 32-byte room_secret
// and DMs it to each member over the Double Ratchet — so the relay (and
// any media forwarder) never sees it. Members feed it to
// fb::media::derive_room_sframe_key to derive each sender's SFrame key.
// Rotated (new secret + bumped epoch) on membership change.
message RoomKey {
    bytes  room_id = 1;   // 32-byte room/channel id
    uint32 epoch   = 2;   // matches RoomRoster.sframe_epoch
    bytes  secret  = 3;   // 32-byte room_secret
}

message DmPayload {
    oneof body {
        string                  text               = 1;
        ChannelKeyDistribution  channel_key        = 2;
        MediaSignal             media_signal       = 3;
        MlsInviteRequest        mls_invite_request = 4;
        MlsKeyPackage           mls_key_package    = 5;
        MlsWelcome              mls_welcome        = 6;
        MlsCommit               mls_commit         = 7;
        MlsProposal             mls_proposal       = 8;
        Attachment              attachment         = 9;
        RoomKey                 room_key           = 10;
    }

    // ---- Sealed sender (Signal-style metadata defense) -------------------
    //
    // When set, the relay-visible Envelope.sender_pubkey is EMPTY — the
    // relay cannot see who sent the message. These two fields ride inside
    // the AEAD-encrypted ratchet payload and are the authoritative sender
    // identity:
    //
    //   sealed_sender_pubkey: 32B Ed25519 — sender's long-term identity
    //   sealed_sender_sig:    64B Ed25519 — sender's detached signature
    //                                       over (envelope_id || timestamp_ms_be)
    //                                       so a relay can't replay an
    //                                       envelope under a different id
    //                                       or shift the timestamp.
    //
    // Recipient flow on a sealed envelope (sender_pubkey empty on wire):
    //   1. Try each existing Session.rat to decrypt env.ciphertext. The
    //      MAC failure of a wrong session is fast; typical N is small.
    //   2. When one decrypts, parse this DmPayload.
    //   3. Require sealed_sender_pubkey == session.peer_pub (a sealed
    //      DM that decrypts under session X must claim sender X — defeats
    //      a relay reordering envelopes between sessions).
    //   4. Verify sealed_sender_sig as Ed25519 over (env.envelope_id ||
    //      env.timestamp_ms big-endian) by sealed_sender_pubkey.
    //
    // First-contact envelopes (no session yet) keep the legacy plaintext
    // sender_pubkey on the wire — Bob has nothing to "try all sessions"
    // against, so a one-time identity reveal is unavoidable without a
    // major protocol change (Noise_NK ephemeral, etc.). All
    // subsequent envelopes from this sender are sealed.
    bytes sealed_sender_pubkey = 100;
    bytes sealed_sender_sig    = 101;
}
